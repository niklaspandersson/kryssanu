services:
  mongo:
    image: mongo:latest
    environment:
      - MONGO_INITDB_ROOT_PASSWORD=${DEV_DB_PASSWORD}
      - MONGO_INITDB_ROOT_USERNAME=${DEV_DB_USER}

  mongo-gui:
    image: mongo-express:latest
    restart: always
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${DEV_DB_USER}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${DEV_DB_PASSWORD}
      - ME_CONFIG_MONGODB_SERVER=mongo
    ports:
      - "8081:8081"

  client:
    build:
      context: client
      dockerfile: Dockerfile.dev
      args:
        - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    environment:
      - NODE_ENV=development
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
    ports:
      - "3000:3000"

  server:
    build:
      context: server
      dockerfile: Dockerfile.dev
    environment:
      - NODE_ENV=development
      - PORT=8000
      - MONGODB_URI=mongodb://mongo
      - MONGODB_USER=${DEV_DB_USER}
      - MONGODB_PASSWORD=${DEV_DB_PASSWORD}
      - BIRDS_PATH=/app/birds.json
      - DEV_FAKE_USER_ID=${DEV_USER_ID}
    ports:
      - "8000:8000"
    volumes:
      - ./server/src:/app/src
      - ./client/public/birds.json:/app/birds.json
