name: Update backend vendor folder

on:
  workflow_dispatch:

jobs:
  update-vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3" # TODO: match the actual PHP version running on the production server

      - run: composer install --no-dev --optimize-autoloader --no-interaction
        working-directory: packages/server-php

      - name: Upload vendor
        uses: Dylan700/sftp-upload-action@latest
        with:
          server: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          uploads: |
            packages/server-php/vendor/ => ${{ secrets.REMOTE_BACKEND_PATH }}/vendor/
          delete: true
